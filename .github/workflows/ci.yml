name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests
        run: |
          docker compose build
          docker compose up --abort-on-container-exit mini-kv-test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install gcc for race detector
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests with coverage and race detector
        run: |
          go mod download
          CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./... || true

      - name: Check if coverage file exists
        id: check_coverage
        run: |
          if [ -f coverage.out ] && [ -s coverage.out ]; then
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate coverage badge
        if: steps.check_coverage.outputs.has_coverage == 'true'
        uses: tj-actions/coverage-badge-go@v3
        with:
          filename: coverage.out

      - name: Commit and push badge
        if: steps.check_coverage.outputs.has_coverage == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f coverage_badge.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coverage badge"
            git push
          fi

      - name: Upload coverage badge
        if: steps.check_coverage.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage_badge.svg

      - name: Generate coverage summary
        if: steps.check_coverage.outputs.has_coverage == 'true'
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Upload coverage reports
        if: steps.check_coverage.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage-summary.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build server
        run: |
          cd server && go build -o ../mini-kv-server .

      - name: Build CLI
        run: |
          cd cli && go build -o ../mini-kv-cli .
