name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests
        run: |
          docker compose build
          docker compose up --abort-on-container-exit mini-kv-test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests with coverage
        run: |
          go mod download
          cd server && go test -coverprofile=../coverage.out -covermode=atomic ./...

      - name: Get coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | grep -Eo '[0-9]+\.[0-9]+' || echo "0")
          echo "Coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Generate badge
        run: |
          apt-get update && apt-get install -y bc
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          COLOR="red"
          if (( $(echo "$COVERAGE > 50" | bc -l) )); then COLOR="orange"; fi
          if (( $(echo "$COVERAGE > 70" | bc -l) )); then COLOR="green"; fi
          curl -s "https://img.shields.io/badge/Coverage-${COVERAGE}%25-${COLOR}" > coverage_badge.svg

      - name: Commit and push badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f coverage_badge.svg
          git commit -m "Update coverage badge" || true
          git push || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build server
        run: |
          cd server && go build -o ../mini-kv-server .

      - name: Build CLI
        run: |
          cd cli && go build -o ../mini-kv-cli .
