; Mini-KV Server Configuration
; This is an INI-style config file

[server]
; Host to bind to (default: localhost)
; Use 0.0.0.0 to bind to all interfaces
host = 0.0.0.0
; Port to listen on (default: 6379)
port = 6379

[cluster]
; Enable clustering mode (default: false)
enabled = false
; Comma-separated list of peer addresses
peers = 
; Unique node ID (auto-generated if empty)
node_id = 
; Gossip port for inter-node communication (default: 16379)
gossip_port = 16379

[security]
; Password for authentication (empty for no auth)
password = 
; TLS certificate file (empty for no TLS)
tls_cert = 
; TLS key file
tls_key = 

[limits]
; Maximum key size in bytes (default: 256)
max_key_size = 256
; Maximum value size in bytes (default: 10485760 = 10MB)
max_value_size = 10485760
; Maximum number of concurrent connections (default: 100)
max_connections = 100
; Connection read timeout in seconds (default: 30)
read_timeout = 30

[console]
; Enable management console UI (default: false)
enabled = false
; Console port (default: 8080)
port = 8080
