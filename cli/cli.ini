; Mini-KV CLI Configuration
; This is an INI-style config file

[server]
; Server hostname or IP address (default: localhost)
host = localhost
; Server port (default: 6379)
port = 6379

[security]
; Password for authentication
password = 

[tls]
; Use TLS connection (default: false)
enabled = false
; Skip TLS certificate verification (default: false)
skip_verify = false
